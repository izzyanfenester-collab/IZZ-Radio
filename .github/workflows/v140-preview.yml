name: IZZ Radio v1.40 TESTING screenshot preview
on:
  push:
    branches: [feature/ten-station-local-logos-v140]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build testing APK
        run: gradle :app:assembleDebug
      - name: Capture real Home screen from Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.izzyan.izzradio.testing/com.izzyan.izzradio.MainActivity
            sleep 8
            mkdir -p preview
            adb shell screencap -p /sdcard/izz-radio-v140-home.png
            adb pull /sdcard/izz-radio-v140-home.png preview/IZZ-Radio-v1.40-HOME.png
      - uses: actions/upload-artifact@v4
        with:
          name: IZZ-Radio-v1.40-REAL-screenshot
          path: preview/IZZ-Radio-v1.40-HOME.png
          if-no-files-found: error
