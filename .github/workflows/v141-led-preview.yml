name: IZZ Radio V1.41 LED Home screenshot
on:
  push:
    branches: [feature/led-dotmatrix-banner-v141]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  led-home-screen:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build V1.41 debug APK
        run: gradle :app:assembleDebug
      - name: Capture actual Android Home screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb shell am start -n com.izzyan.izzradio.testingv141/com.izzyan.izzradio.MainActivity
            sleep 10
            mkdir -p preview
            adb shell screencap -p /sdcard/izz-radio-v141-led.png
            adb pull /sdcard/izz-radio-v141-led.png preview/IZZ-Radio-V1.41-LED-HOME.png
      - uses: actions/upload-artifact@v4
        with:
          name: IZZ-Radio-V1.41-REAL-LED-Screenshot
          path: preview/IZZ-Radio-V1.41-LED-HOME.png
          if-no-files-found: error
