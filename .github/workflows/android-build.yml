name: Android debug APK
on:
  push:
    branches: [main, codex/izz-radio-final, feature/compact-square-radio-v136, feature/selawat-v137, feature/sinar-hitz-local-logos-v138, feature/ten-station-local-logos-v139, feature/maximized-frameless-station-logos-v140, release/izz-radio-v140-official, feature/led-dotmatrix-banner-v141, feature/led-dotmatrix-readability-v142]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build V1.42 TESTING APK and verify LED font/glyph tests
        run: |
          gradle :app:assembleDebug --stacktrace
          gradle :app:testDebugUnitTest --tests 'com.izzyan.izzradio.PlaybackGateTest' --tests 'com.izzyan.izzradio.StreamAttemptsTest' --tests 'com.izzyan.izzradio.WakeCycleTrackerTest' --tests 'com.izzyan.izzradio.LedBannerStateTest' --tests 'com.izzyan.izzradio.LedMatrixFontTest'
      - name: Android UI / Robolectric tests (non-blocking if external SDK artifacts unavailable)
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IZZ-Radio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Bundle v1.42 TESTING source
        run: git archive --format=zip --output=IZZ-Radio-v1.42-TESTING-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: IZZ-Radio-v1.42-TESTING-source
          path: IZZ-Radio-v1.42-TESTING-source.zip
          if-no-files-found: error
