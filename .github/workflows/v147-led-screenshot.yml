name: IZZ Radio V1.47 real LED screenshot
on:
  push:
    branches: [feature/led-v142-colors-v147]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ANDROID_I_WANT_MY_TCG: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build V1.47
        run: gradle :app:assembleDebug
      - name: Real Android emulator screenshot (software acceleration fallback)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: true
          emulator-boot-timeout: 650
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb shell am start -n com.izzyan.izzradio.testingv147/com.izzyan.izzradio.MainActivity
            sleep 8
            mkdir -p preview
            adb wait-for-device
            adb exec-out screencap -p > preview/IZZ-Radio-V1.47-REAL-HOME.png
            test -s preview/IZZ-Radio-V1.47-REAL-HOME.png
      - uses: actions/upload-artifact@v4
        with:
          name: IZZ-Radio-v1.44-real-screenshot
          path: preview/IZZ-Radio-V1.47-REAL-HOME.png
          if-no-files-found: error
