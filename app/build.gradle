plugins { id 'com.android.application' }
android {
    namespace 'com.izzyan.izzradio'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'com.izzyan.izzradio'; minSdk 24; targetSdk 35; versionCode 50; versionName '1.46'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    // Isolate TESTING install from Official to protect existing user data.
    buildTypes { debug { applicationIdSuffix '.testingv146' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/stations')
}
tasks.register('copyStations', Copy) { from rootProject.file('stations.json'); into layout.buildDirectory.dir('generated/stations') }
tasks.named('preBuild').configure { dependsOn 'copyStations' }
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Fail closed: never package the legacy recording or a modified substitute.
tasks.register('verifySelawatAudio') {
    def audio = file('src/main/res/raw/doa_menaiki_kenderaan.mp3')
    inputs.file(audio)
    doLast {
        def expected = 'df8a58e7704a30cab36f317d7eca42704fcd9c0c71ea60a44d9d7a6812736b9e'
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(audio.bytes).encodeHex().toString()
        if (actual != expected) throw new GradleException('Selawat asset missing or incorrect: replace app/src/main/res/raw/doa_menaiki_kenderaan.mp3 with the exact supplied MP3 before building.')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifySelawatAudio' }


// Prevent accidental substitution, truncation, or cached remote assets.
tasks.register('verifyExactStationLogos') {
    def logos = [
        'sinar.png': '4f60765646c35aa18a9f342b4f2eb3a70a495340aa121e0f4d2611b775aa817a',
        'hitz.webp' : '3a28fd7db0dae37160326c9fef5fcaa92a99727b73b2f9c6fb95e6dec1328abb',
        'asyik_fm.png': '8fad6bef1bae20db504d3f9a40483280d085b06db7f788bdc8c413a8e704a076',
        'ai_fm.png': 'dbad14df13649f5302674896aac793b3116fde9c4135406f4db291d0812d3bf4',
        'traxx_fm.jpg': '334532d6ceeb6b0a6b2baedd0f42c3cf4d5782cb0369b83d52e363faed994b8d',
        'nasional_fm.jpg': '11ee1d1517e76dc69573cf97bfafd67eff7f5ffd27a3d3a3d26ef66ed783a904',
        'eight_fm.jpg': '464f620077faca5ddb06f8982a41345aa1a0ac0b4b4120870f9aaff888c659c0',
        'radio_klasik.jpg': '1550950e760f47e79831cfaba53c55ab482489acfbb680fee99a6405a6c88dcc',
        'johor_fm.jpg': '55076a68d2f07bc2e16d839b48335ccb6ed40ea449fcafb5f031791111718beb',
        'best_fm.jpg': '10753d849f1fe4180c79d8e8abee7e0035e0c35e247692331de46a60f6e9b651',
        'zayan.png': 'e47f45b6077002fe799ed15e1e8dedf735d1003a5cf0879c80fedc3ea1f6c25e',
        'gegar_pantai_timur.jpg': 'b70ec3e589527791f886d10db32c9b091e7be5fa2f307693a7c2cf9277cc7757'
    ]
    inputs.files(logos.keySet().collect { file("src/main/assets/logos/${it}") })
    doLast {
        logos.each { name, expected ->
            def input = file("src/main/assets/logos/${name}")
            def decoded = input.bytes
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(decoded).encodeHex().toString()
            if (actual != expected) throw new GradleException("Incorrect bundled station logo: ${name}")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyExactStationLogos' }
